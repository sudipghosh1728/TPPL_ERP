name: Application checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Backend and department permissions
        env:
          MONGODB_TEST_URI: mongodb://127.0.0.1:27018/?replicaSet=tppl-test
        run: |
          python -m pip install -r requirements.txt
          docker run -d --name tppl-test-mongo -p 127.0.0.1:27018:27018 mongo:8.0 --replSet tppl-test --bind_ip_all --port 27018
          for i in $(seq 1 30); do
            docker exec tppl-test-mongo mongosh --port 27018 --quiet --eval 'db.adminCommand({ping:1})' && break
            sleep 1
          done
          docker exec tppl-test-mongo mongosh --port 27018 --quiet --eval 'rs.initiate({_id:"tppl-test",members:[{_id:0,host:"127.0.0.1:27018"}]})'
          for i in $(seq 1 30); do
            docker exec tppl-test-mongo mongosh --port 27018 --quiet --eval 'if(!db.hello().isWritablePrimary) quit(1)' && break
            sleep 1
          done
          python -m unittest discover -p 'test_*.py' -v
      - name: JavaScript syntax
        run: |
          node --check public/app.js
          node --check public/finance.js
          node --check public/workflow.js

          node --check public/company.js
          node --check public/store.js
          node --check public/stock-workbench.js
          node --check public/financial-reports.js
          node --check public/store-daily.js
